name: Deploy Dev

on:
  push:
    branches:
      - dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Prepare deploy directory
        run: |
          mkdir -p /tmp/deploy
          cp vvp-divi5-extensions.php /tmp/deploy/
          sed -i 's/^Plugin Name: .*/Plugin Name: Volksverpetzer DIVI 5 extensions (Beta)/' /tmp/deploy/vvp-divi5-extensions.php
          cp -r modules /tmp/deploy/
          cp -r modules-json /tmp/deploy/
          for f in /tmp/deploy/modules-json/*/module.json; do
            jq '.title += " (Beta)" | .titles += " (Beta)"' "$f" > /tmp/module_tmp.json && mv /tmp/module_tmp.json "$f"
          done
          cp -r scripts /tmp/deploy/
          cp -r styles /tmp/deploy/

      - name: Upload to FTP (dev)
        env:
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
        run: |
          sudo apt-get update && sudo apt-get install -y lftp
          cat > /tmp/lftp-script.txt << 'LFTP'
          set ftp:ssl-allow yes
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ssl:verify-certificate no
          LFTP
          echo "open -u ${FTP_USER},${FTP_PASSWORD} ${FTP_HOST}" >> /tmp/lftp-script.txt
          cat >> /tmp/lftp-script.txt << 'LFTP'
          mirror --reverse --delete --verbose /tmp/deploy/ /public_html/wp-content/plugins/vvp-divi5-extensions-dev/
          bye
          LFTP
          lftp -f /tmp/lftp-script.txt
