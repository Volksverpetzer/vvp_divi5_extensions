name: Deploy Dev

on:
  push:
    branches:
      - dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Upload to FTP (dev)
        env:
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
        run: |
          sudo apt-get update && sudo apt-get install -y lftp
          cat > /tmp/lftp-script.txt << 'LFTP'
          set ftp:ssl-allow yes
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ssl:verify-certificate no
          LFTP
          echo "open -u ${FTP_USER},${FTP_PASSWORD} ${FTP_HOST}" >> /tmp/lftp-script.txt
          cat >> /tmp/lftp-script.txt << 'LFTP'
          mirror --reverse --delete --verbose --exclude-glob=.git --exclude-glob=node_modules --exclude-glob=src --exclude-glob=dist --exclude-glob=vite --exclude-glob=preview --exclude-glob=reference --exclude-glob=.* --exclude-glob=webpack.config.js --exclude-glob=gulpfile.js --exclude-glob=tsconfig.json --exclude-glob=package.json --exclude-glob=package-lock.json --exclude-glob=pnpm-lock.yaml --exclude-glob=composer.json --exclude-glob=composer.lock --exclude-glob=README.md --exclude-glob=search.tsx --exclude-glob=*.map ./ /public_html/wp-content/plugins/vvp-fact-check-search-dev/
          bye
          LFTP
          lftp -f /tmp/lftp-script.txt
