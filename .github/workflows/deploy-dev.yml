name: Deploy Dev

on:
  push:
    branches:
      - dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Create ZIP
        run: npm run zip

      - name: Upload to FTP (dev)
        run: |
          curl --ftp-create-dirs \
            --user "${{ secrets.FTP_USER }}:${{ secrets.FTP_PASSWORD }}" \
            --upload-file vvp-fact-check-search.zip \
            "ftp://${{ secrets.FTP_HOST }}${{ secrets.FTP_DEV_PATH }}vvp-fact-check-search.zip"
