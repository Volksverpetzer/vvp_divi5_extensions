name: Test and Lint

on:
  pull_request:
  push:
    branches:
      - dev
      - prerelease

permissions:
  contents: read
  pull-requests: write # gitleaks comments scan results on PRs

jobs:
  check:
    name: 🧪 Check, Test and Lint
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🔍 Check for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v6

      - name: 🏗 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🏃‍♀️ Lint
        run: pnpm lint

      - name: ✅ Check (spelling + types)
        run: pnpm check

      - name: 🏃‍♀️ Test
        run: pnpm test --run
