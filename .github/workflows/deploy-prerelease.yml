name: Deploy Prerelease

on:
  push:
    branches:
      - prerelease

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: 🚀 Deploy Prerelease
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v7

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v6

      - name: 🏗 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🏗 Build
        # Dev build: unminified + React development build, so runtime errors on
        # the Beta instance show full messages (not minified codes like #418)
        # plus hydration warnings. Production stays minified (deploy-prod.yml).
        run: pnpm run build:dev

      - name: 🛠 Prepare deploy directory
        run: |
          mkdir -p /tmp/deploy
          cp vvp-divi5-extensions.php /tmp/deploy/
          SEMVER=$(grep "^Version:" vvp-divi5-extensions.php | sed 's/Version:[[:space:]]*//')
          BUILD_DATE=$(date -u +"%Y%m%d-%H%M%S")
          VERSION="${SEMVER}-beta-${BUILD_DATE}-${GITHUB_SHA::7}"
          sed -i 's/^Plugin Name: .*/Plugin Name: Volksverpetzer DIVI 5 extensions (Beta)/' /tmp/deploy/vvp-divi5-extensions.php
          sed -i "s/^Version:.*/Version:     ${VERSION}/" /tmp/deploy/vvp-divi5-extensions.php
          sed -i "s/define( 'VVP_DIVI5_VERSION', '[^']*' )/define( 'VVP_DIVI5_VERSION', '${VERSION}' )/" /tmp/deploy/vvp-divi5-extensions.php
          cp -r includes /tmp/deploy/
          cp -r modules /tmp/deploy/
          cp -r modules-json /tmp/deploy/
          for f in /tmp/deploy/modules-json/*/module.json; do
            jq '.title += " (Beta)" | .titles += " (Beta)"' "$f" > /tmp/module_tmp.json && mv /tmp/module_tmp.json "$f"
          done
          cp -r scripts /tmp/deploy/
          cp -r styles /tmp/deploy/

      - name: 🔑 Set up SSH key
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.SSH_DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.SSH_HOST_KEY }}" >> ~/.ssh/known_hosts

      - name: 🚀 Deploy via rsync
        run: |
          rsync -avzO --no-perms --delete \
            --exclude='.DS_Store' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            /tmp/deploy/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:plugins/vvp-divi5-extensions-dev/

      - name: 🧹 Purge Bunny CDN cache for this plugin's assets
        # Bunny caches plugin assets for 30 days and ignores query-string
        # cache-busting (?ver=...), so without this every deploy would keep
        # serving whatever was first cached until it expires on its own.
        # Scoped to just this plugin's path (wildcard prefix purge) rather
        # than the whole zone, so it doesn't evict unrelated cached content
        # on every deploy.
        run: |
          curl -sS --fail -G -X POST \
            --data-urlencode "url=https://volksverpetzer.de/wp-content/plugins/vvp-divi5-extensions-dev/*" \
            "https://api.bunny.net/purge" \
            -H "AccessKey: ${{ secrets.BUNNY_API_KEY }}"

      - name: 🧹 Clear Divi's static CSS cache
        # Divi generates each page's module CSS (including this plugin's
        # module decoration styles) once and caches it as static files under
        # wp-content/et-cache/. That cache isn't tied to the plugin files we
        # just rsynced, so a PHP-side style change can deploy successfully
        # and still appear to do nothing until the stale et-cache entries are
        # cleared — Divi regenerates them lazily on next page view.
        #
        # The deploy key is locked to rrsync — confirmed by the first real
        # run of this step failing with "SSH_ORIGINAL_COMMAND does not run
        # rsync" — so it can only speak the rsync protocol, not run
        # arbitrary shell commands like `rm -rf`. Clear the cache the same
        # way: rsync an empty directory over it with --delete, at the same
        # relative path convention (rooted wherever rrsync's forced command
        # scopes it — proven by "plugins/..." above landing in
        # wp-content/plugins/ — not the deploy user's shell $HOME).
        #
        # mktemp -d, not a fixed path, so the "empty" source directory is
        # guaranteed to actually be empty (a stale fixed path could get
        # --delete'd *into* et-cache/ instead of clearing it). Flags mirror
        # the deploy step above exactly rather than a fresh guess, since
        # this rrsync setup's accepted option set is otherwise unknown.
        #
        # --exclude='.*' preserves `rm -rf et-cache/*`'s original semantics
        # (a shell glob doesn't match dotfiles either) — rsync --delete has
        # no such exception by default and would otherwise remove something
        # like a stray .htaccess in there too.
        #
        # If "et-cache/" is the wrong relative path under rrsync's forced
        # root, rsync happily creates it as a new empty directory and exits
        # 0 — the exact "deploy succeeded, nothing actually happened" trap
        # this whole fix chain keeps running into, just one level deeper.
        # --stats reports whether the destination had to be newly created;
        # fail loudly instead of reporting a false "cleared" here too.
        run: |
          EMPTY_DIR=$(mktemp -d)
          STATS=$(rsync -avzO --no-perms --delete --exclude='.*' --stats \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            "$EMPTY_DIR/" \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:et-cache/)
          echo "$STATS"
          if echo "$STATS" | grep -qE '^Number of created files: [1-9]'; then
            echo "::error::et-cache/ did not exist before this sync (rsync had to create it) — the target path is likely wrong under rrsync's forced root, and Divi's cache was not actually cleared"
            exit 1
          fi
