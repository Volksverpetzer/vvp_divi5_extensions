name: Deploy Production

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Prepare deploy directory
        run: |
          mkdir -p /tmp/deploy
          cp vvp-fact-check-search.php /tmp/deploy/
          cp -r modules /tmp/deploy/
          cp -r modules-json /tmp/deploy/
          cp -r scripts /tmp/deploy/
          cp -r styles /tmp/deploy/

      - name: Upload to FTP (production)
        env:
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
        run: |
          sudo apt-get update && sudo apt-get install -y lftp
          cat > /tmp/lftp-script.txt << 'LFTP'
          set ftp:ssl-allow yes
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ssl:verify-certificate no
          LFTP
          echo "open -u ${FTP_USER},${FTP_PASSWORD} ${FTP_HOST}" >> /tmp/lftp-script.txt
          cat >> /tmp/lftp-script.txt << 'LFTP'
          mirror --reverse --delete --verbose /tmp/deploy/ /public_html/wp-content/plugins/vvp-fact-check-search-prod/
          bye
          LFTP
          lftp -f /tmp/lftp-script.txt
