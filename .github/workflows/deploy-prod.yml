name: Deploy Production

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Prepare deploy directory
        run: |
          mkdir -p /tmp/deploy
          cp vvp-divi5-extensions.php /tmp/deploy/
          cp -r includes /tmp/deploy/
          cp -r modules /tmp/deploy/
          cp -r modules-json /tmp/deploy/
          cp -r scripts /tmp/deploy/
          cp -r styles /tmp/deploy/

      - name: Set up SSH key
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.SSH_DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.SSH_HOST_KEY }}" >> ~/.ssh/known_hosts

      - name: Deploy via rsync
        run: |
          rsync -avzO --no-perms --delete \
            --exclude='.DS_Store' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            /tmp/deploy/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:plugins/vvp-divi5-extensions-prod/

      - name: Purge Bunny CDN cache
        # Bunny caches plugin assets for 30 days and ignores query-string
        # cache-busting (?ver=...), so without this every deploy would keep
        # serving whatever was first cached until it expires on its own.
        run: |
          curl -sS --fail -X POST "https://api.bunny.net/pullzone/${{ secrets.BUNNY_PULL_ZONE_ID }}/purgeCache" \
            -H "AccessKey: ${{ secrets.BUNNY_API_KEY }}" \
            -H "Content-Type: application/json"
