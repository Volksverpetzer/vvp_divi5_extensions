name: Deploy Production

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: 🚀 Deploy Production
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v7

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v6

      - name: 🏗 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🏗 Build
        run: pnpm run build

      - name: 🛠 Prepare deploy directory
        run: |
          mkdir -p /tmp/deploy
          cp vvp-divi5-extensions.php /tmp/deploy/
          cp -r includes /tmp/deploy/
          cp -r modules /tmp/deploy/
          cp -r modules-json /tmp/deploy/
          cp -r scripts /tmp/deploy/
          cp -r styles /tmp/deploy/

      - name: 🔑 Set up SSH key
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.SSH_DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.SSH_HOST_KEY }}" >> ~/.ssh/known_hosts

      - name: 🚀 Deploy via rsync
        run: |
          rsync -avzO --no-perms --delete \
            --exclude='.DS_Store' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            /tmp/deploy/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:plugins/vvp-divi5-extensions-prod/

      - name: 🧹 Purge Bunny CDN cache for this plugin's assets
        # Bunny caches plugin assets for 30 days and ignores query-string
        # cache-busting (?ver=...), so without this every deploy would keep
        # serving whatever was first cached until it expires on its own.
        # Scoped to just this plugin's path (wildcard prefix purge) rather
        # than the whole zone, so it doesn't evict unrelated cached content
        # on every deploy.
        run: |
          curl -sS --fail -G -X POST \
            --data-urlencode "url=https://volksverpetzer.de/wp-content/plugins/vvp-divi5-extensions-prod/*" \
            "https://api.bunny.net/purge" \
            -H "AccessKey: ${{ secrets.BUNNY_API_KEY }}"

      - name: 🧹 Clear Divi's static CSS cache
        # Divi generates each page's module CSS (including this plugin's
        # module decoration styles) once and caches it as static files under
        # wp-content/et-cache/. That cache isn't tied to the plugin files we
        # just rsynced, so a PHP-side style change can deploy successfully
        # and still appear to do nothing until the stale et-cache entries are
        # cleared — Divi regenerates them lazily on next page view.
        #
        # Absolute path, not one relative to the deploy user's login home
        # (/home/deploy) — that's a different directory than the WP install
        # root (/var/www/html), so a bare "et-cache/*" would silently no-op.
        #
        # `rm -rf` on a missing directory exits 0 either way, so a wrong
        # path here would fail exactly as silently as the bug this step
        # fixes — the test -d guard turns that into a loud CI failure
        # instead of another "deploy succeeded, nothing happened" trap.
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "test -d /var/www/html/wp-content/et-cache || { echo '::error::et-cache directory not found at /var/www/html/wp-content/et-cache'; exit 1; }; rm -rf /var/www/html/wp-content/et-cache/*"
