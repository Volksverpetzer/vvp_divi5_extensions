allowBuilds:
  "@parcel/watcher": true
  esbuild: true
nodeLinker: hoisted # see https://pnpm.io/settings#nodelinker
packages:
  - .
overrides:
  # GHSA-w5hq-g745-h8pq: uuid <11.1.1, pulled in via @wordpress/blocks (Divi packages)
  "uuid@<11.1.1": "^11.1.1"
  # GHSA-g3hv-75wg-m249: minimatch 10.2.6 via glob@13.0.6 (eslint, @eslint/config-array
  # and typescript-estree already ask for minimatch 11; glob only calls it with
  # standard options, unchanged in 11). Drop once glob asks for minimatch 11.
  "minimatch@>=7.0.0 <11.0.1": "^11.0.1"
minimumReleaseAgeExclude:
  - "@typescript-eslint/eslint-plugin@8.74.0"
  - "@typescript-eslint/parser@8.74.0"
  - "@typescript-eslint/project-service@8.74.0"
  - "@typescript-eslint/scope-manager@8.74.0"
  - "@typescript-eslint/tsconfig-utils@8.74.0"
  - "@typescript-eslint/type-utils@8.74.0"
  - "@typescript-eslint/types@8.74.0"
  - "@typescript-eslint/typescript-estree@8.74.0"
  - "@typescript-eslint/utils@8.74.0"
  - "@typescript-eslint/visitor-keys@8.74.0"
